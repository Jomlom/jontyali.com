  <!-- styles -->
  <link rel="stylesheet" href="../style.css">
  <style>
    .contact-row { display: flex; align-items: stretch; border-top: 1px solid var(--border); }
    .contact-row:first-child { border-top: 0; }
    .contact-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1rem; padding: clamp(0.4rem, 1.1vh, 0.8rem) 1.2rem; font-size: 1.5rem; color: var(--text); text-decoration: none; }
    .contact-link img { width: 2.2rem; height: 2.2rem; object-fit: contain; }
    .contact-link .handle { margin-left: auto; color: var(--text-dim); }
    .contact-link::after { content: '→'; color: var(--text-dim); }
    .contact-link:hover, .contact-link:focus-visible { background: var(--purple-glow); color: var(--purple); outline: none; }
    .contact-link:hover .handle, .contact-link:hover::after, .contact-link:focus-visible .handle, .contact-link:focus-visible::after { color: var(--purple); }
    .contact-link .label { color: var(--brand, inherit); }
    .contact-link.github { --brand: #fff; }
    .contact-link.modrinth { --brand: #1bd96a; }
    .contact-link.linkedin { --brand: #0a66c2; }
    .contact-link.kofi { --brand: #ff5e5b; }
    .contact-link.instagram .label { background: linear-gradient(90deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .contact-copy { padding: 0 1.2rem; font-size: 1.2rem; color: var(--text-dim); background: none; border: 0; border-left: 1px solid var(--border); }
    .contact-copy:hover, .contact-copy:focus-visible { color: var(--purple); outline: none; }

    .contact-more { border-top: 1px solid var(--border); }
    .contact-more summary { display: flex; justify-content: space-between; padding: clamp(0.4rem, 1.1vh, 0.8rem) 1.2rem; font-size: 1.5rem; color: var(--text); list-style: none; }
    .contact-more summary::-webkit-details-marker { display: none; }
    .contact-more summary::after { content: '+'; color: var(--text-dim); }
    .contact-more[open] summary::after { content: '−'; }
    .contact-more summary:hover, .contact-more summary:focus-visible { background: var(--purple-glow); color: var(--purple); outline: none; }

    .contact-form { display: grid; gap: 1rem; padding: 1.2rem; border-top: 1px solid var(--border); }
    .contact-form label { display: block; margin-bottom: 0.3rem; font-size: 1.2rem; color: var(--text-dim); }
    .contact-input { width: 100%; padding: 0.7rem 1rem; font-size: 1.4rem; color: var(--text); background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); outline: none; transition: border-color 0.15s; }
    .contact-input:focus { border-color: var(--purple-border); }
    textarea.contact-input { min-height: 6rem; resize: vertical; line-height: 1.6; }
    .contact-botcheck { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
    .contact-actions { display: flex; align-items: center; gap: 1.4rem; }
    .contact-submit { padding: 0.5rem 1.6rem; font-size: 1.4rem; color: var(--purple); background: none; border: 1px solid var(--purple-border); }
    .contact-submit:hover:not(:disabled), .contact-submit:focus-visible { background: var(--purple-glow); outline: none; }
    .contact-submit:disabled { opacity: 0.5; }
    .contact-status { font-size: 1.2rem; color: var(--text-muted); }
    .contact-status.ok { color: var(--purple); }
    .contact-status.err { color: var(--red); }

    @media (max-width: 480px) {
      .contact-row.email .label { display: none; }
      .contact-row.email .handle { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <canvas id="bg-stars-canvas"></canvas>

  <section class="hero">
    <canvas id="hero-canvas"></canvas>
    <div class="hero-panel">
      <a class="panel-back" href="/">&larr; Jonty Ali</a>
      <h1 class="panel-title">Contact</h1>
      <p class="panel-lead">Open to conversations about my work, studies, or anything interesting.</p>

      <div class="panel-box">
        <div class="contact-row email">
          <a class="contact-link" href="mailto:contact@jontyali.com">
            <img src="../images/links/mail.png" alt="">
            <span class="label">Email</span>
            <span class="handle">contact@jontyali.com</span>
          </a>
          <button type="button" class="contact-copy" data-copy="contact@jontyali.com">copy</button>
        </div>
        <div class="contact-row">
          <a class="contact-link github" href="https://github.com/Jomlom" target="_blank" rel="noopener me">
            <img src="../images/links/github.svg" alt="">
            <span class="label">GitHub</span>
            <span class="handle">Jomlom</span>
          </a>
        </div>
        <div class="contact-row">
          <a class="contact-link modrinth" href="https://modrinth.com/user/Jomlom" target="_blank" rel="noopener me">
            <img src="../images/links/modrinth.svg" alt="">
            <span class="label">Modrinth</span>
            <span class="handle">Jomlom</span>
          </a>
        </div>
        <div class="contact-row">
          <a class="contact-link linkedin" href="https://www.linkedin.com/in/jonty-ali-722b8926a/" target="_blank" rel="noopener me">
            <img src="../images/links/linkedin.svg" alt="">
            <span class="label">LinkedIn</span>
            <span class="handle">jonty-ali</span>
          </a>
        </div>
        <div class="contact-row">
          <a class="contact-link instagram" href="https://www.instagram.com/joontyy/" target="_blank" rel="noopener me">
            <img src="../images/links/instagram.svg" alt="">
            <span class="label">Instagram</span>
            <span class="handle">joontyy</span>
          </a>
        </div>
        <div class="contact-row">
          <a class="contact-link kofi" href="https://ko-fi.com/jontyali" target="_blank" rel="noopener me">
            <img src="../images/links/kofi.svg" alt="">
            <span class="label">Ko-fi</span>
            <span class="handle">jontyali</span>
          </a>
        </div>

        <details class="contact-more">
          <summary>Send a message</summary>
          <form id="contact-form" class="contact-form">
            <input type="hidden" name="access_key" value="c144a0dd-9856-4eef-b95e-96f8c953ad45">
            <input type="hidden" name="subject" value="New message from jontyali.com">
            <input type="hidden" name="from_name" value="jontyali.com quick contact">
            <input type="checkbox" name="botcheck" class="contact-botcheck" tabindex="-1" autocomplete="off">
            <div>
              <label for="cf-name">Name</label>
              <input class="contact-input" id="cf-name" name="name" type="text" required autocomplete="name">
            </div>
            <div>
              <label for="cf-email">Email (I'll reply here)</label>
              <input class="contact-input" id="cf-email" name="email" type="email" required autocomplete="email">
            </div>
            <div>
              <label for="cf-message">Message</label>
              <textarea class="contact-input" id="cf-message" name="message" rows="3" required></textarea>
            </div>
            <div class="contact-actions">
              <button type="submit" class="contact-submit">Send</button>
              <span class="contact-status" id="cf-status" role="status" aria-live="polite"></span>
            </div>
          </form>
        </details>
      </div>
    </div>
  </section>

  <script src="../hero-sim.js"></script>
  <script src="../bg-stars.js"></script>
  <script>
    document.querySelector('.contact-copy').addEventListener('click', e => {
      navigator.clipboard.writeText(e.target.dataset.copy)
      e.target.textContent = 'copied'
      setTimeout(() => { e.target.textContent = 'copy' }, 1500)
    })

    const form = document.getElementById('contact-form')
    const status = document.getElementById('cf-status')
    const submit = form.querySelector('.contact-submit')

    form.addEventListener('submit', e => {
      e.preventDefault()
      submit.disabled = true
      status.textContent = 'sending...'
      status.className = 'contact-status'

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      })
        .then(res => res.json().then(json => ({ ok: res.ok, json })))
        .then(({ ok, json }) => {
          if (ok && json.success) {
            status.textContent = "sent, I'll reply to your email soon"
            status.className = 'contact-status ok'
            form.reset()
          } else {
            status.textContent = json.message || 'something went wrong, try emailing directly'
            status.className = 'contact-status err'
          }
        })
        .catch(() => {
          status.textContent = 'something went wrong, try emailing directly'
          status.className = 'contact-status err'
        })
        .finally(() => { submit.disabled = false })
    })
  </script>

</body>
</html>
