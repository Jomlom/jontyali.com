  <script>
    const artPopup = document.getElementById('art-popup')
    const artPopupContent = artPopup.querySelector('.art-popup-content')
    const artMediums = ['oil', 'photo', 'biro', 'pencil', 'coloured-pencil', 'ceramic', 'pixel']

    function openArtPopup(item) {
      const detail = item.querySelector('.art-detail')
      if (!detail) return
      artPopupContent.classList.remove(...artMediums)
      artMediums.forEach(m => { if (item.classList.contains(m)) artPopupContent.classList.add(m) })
      artPopupContent.innerHTML = ''
      artPopupContent.appendChild(detail.content.cloneNode(true))
      artPopup.hidden = false
    }

    function closeArtPopup() {
      artPopup.hidden = true
      artPopupContent.innerHTML = ''
    }

    document.querySelectorAll('.art-item').forEach(item => {
      item.addEventListener('click', () => openArtPopup(item))
    })

    artPopup.addEventListener('click', e => {
      if (e.target.closest('[data-close]')) closeArtPopup()
    })

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !artPopup.hidden) closeArtPopup()
    })
  </script>
