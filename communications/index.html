<head>

  <title>Communications - Jonty Ali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&family=DM+Sans:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .comms-content {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
    }
    .comms-intro {
      color: var(--text-muted);
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }
    .comms-note {
      color: var(--text-dim);
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      margin-bottom: 2.5rem;
    }
    .channels {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.3rem;
      max-width: 100%;
    }
    .channel-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .channel {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      width: 54rem;
      max-width: 100%;
      padding: 0.55rem 1rem;
      font-family: var(--font-ui);
      font-size: 2rem;
      color: var(--purple);
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    .channel.email {
      color: var(--red);
    }
    .channel.kofi {
      color: #fff;
    }
    .kofi-label-text {
      position: relative;
      display: inline-block;
    }
    .kofi-splash {
      position: absolute;
      left: 70%;
      top: 78%;
      margin-left: 0;
      white-space: nowrap;
      pointer-events: none;
      font-size: 1.05rem;
      text-transform: none;
      letter-spacing: 0.02em;
      transform: rotate(-9deg);
      transform-origin: left center;
      animation: featured-pulse-white 4s ease-in-out infinite;
    }
    @keyframes featured-pulse-white {
      0%, 100% { text-shadow: 0 0 6px rgba(255, 255, 255, 0.32); }
      50%      { text-shadow: 0 0 8px rgba(255, 255, 255, 0.44); }
    }
    .channel .arrow {
      display: inline-block;
      width: 1.2rem;
      flex: 0 0 1.2rem;
      opacity: 0;
    }
    .channel-icon {
      width: 2.3rem;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      object-fit: contain;
    }
    .channel-label {
      flex: 0 0 14rem;
      text-transform: uppercase;
    }
    .channel-value {
      flex: 1;
      opacity: 0.7;
    }
    .channel-ext { opacity: 0.6; }
    .channel-copy {
      font-family: var(--font-ui);
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      color: var(--red);
      background: none;
      border: 1px solid currentColor;
      padding: 0.25rem 0.9rem;
      cursor: pointer;
    }
    .channel-copy:hover {
      background: var(--red);
      color: #000;
    }
    @media (max-width: 768px) {
      .comms-intro { font-size: 1.25rem; }
      .channels { gap: 0.5rem; }
      .channel-row { flex-direction: column; align-items: stretch; gap: 0.5rem; }
      .channel { width: auto; font-size: 1.5rem; gap: 0.8rem; padding: 0.65rem 0.9rem; }
      .channel .arrow,
      .channel-ext { display: none; }
      .channel-label { display: block; flex: 1; }
      .channel-value { display: none; }
      .channel.email .channel-label { display: none; }
      .channel.email .channel-value { display: block; flex: 1; }
      .channel-copy { font-size: 1.4rem; padding: 0.35rem 1rem; align-self: center; }
    }
    .quick-contact {
      margin-top: 2.8rem;
      width: 54rem;
      max-width: 100%;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-top: 1.1rem;
    }
    .contact-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .contact-label {
      font-family: var(--font-ui);
      font-size: 1.15rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .contact-input {
      font-family: var(--font-mono);
      font-size: 1.4rem;
      color: var(--text);
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 0.7rem 1rem;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .contact-input:focus { border-color: var(--purple-border); }
    .contact-textarea {
      resize: vertical;
      min-height: 8rem;
      line-height: 1.6;
    }
    .contact-botcheck {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      height: 0;
      width: 0;
    }
    .contact-actions {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      margin-top: 0.2rem;
    }
    .contact-submit {
      font-family: var(--font-ui);
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--purple);
      background: none;
      border: 1px solid currentColor;
      padding: 0.5rem 1.6rem;
      cursor: pointer;
    }
    .contact-submit:hover:not(:disabled) { background: var(--purple); color: #000; }
    .contact-submit:disabled { opacity: 0.5; cursor: default; }
    .contact-status {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      color: var(--text-dim);
    }
    .contact-status.ok { color: var(--purple); }
    .contact-status.err { color: var(--red); }
    @media (max-width: 768px) {
      .quick-contact { margin-top: 2rem; }
      .contact-input { font-size: 1.3rem; padding: 0.6rem 0.8rem; }
      .contact-submit { font-size: 1.4rem; padding: 0.45rem 1.3rem; }
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "url": "https://jontyali.com/communications/",
    "name": "Communications - Jonty Ali",
    "description": "How to contact Jonty Ali. His main point of contact is his public email, contact@jontyali.com.",
    "mainEntity": {
      "@type": "Person",
      "name": "Jonty Ali",
      "url": "https://jontyali.com",
      "email": "mailto:contact@jontyali.com",
      "sameAs": [
        "https://github.com/Jomlom",
        "https://www.linkedin.com/in/jonty-ali-722b8926a/",
        "https://ko-fi.com/jontyali"
      ]
    }
  }
  </script>
</head>
<body>

  <canvas id="bg-stars-canvas"></canvas>
  <div class="noise"></div>

  <site-nav></site-nav>

  <main class="page-main">
    <section class="section">
      <div class="comms-content">
      <p class="comms-intro">Open to conversations about my work, studies, or anything interesting</p>
      <p class="comms-note">Timezone UTC+1</p>
      <div class="channels">
        <div class="channel-row">
          <a class="channel email" href="mailto:contact@jontyali.com">
            <span class="arrow">&gt;</span>
            <img class="channel-icon" src="mail.png" alt="">
            <span class="channel-label">Email</span>
            <span class="channel-value">contact@jontyali.com</span>
            <span class="channel-ext">&#8599;</span>
          </a>
          <button type="button" class="channel-copy" data-copy="contact@jontyali.com">copy</button>
        </div>
        <a class="channel" href="https://www.linkedin.com/in/jonty-ali-722b8926a/" target="_blank" rel="noopener me">
          <span class="arrow">&gt;</span>
          <img class="channel-icon" src="linkedin.png" alt="">
          <span class="channel-label">LinkedIn</span>
          <span class="channel-value">jonty-ali</span>
          <span class="channel-ext">&#8599;</span>
        </a>
        <a class="channel" href="https://github.com/Jomlom" target="_blank" rel="noopener me">
          <span class="arrow">&gt;</span>
          <img class="channel-icon" src="github.png" alt="">
          <span class="channel-label">GitHub</span>
          <span class="channel-value">Jomlom</span>
          <span class="channel-ext">&#8599;</span>
        </a>
        <a class="channel kofi" href="https://ko-fi.com/jontyali" target="_blank" rel="noopener me">
          <span class="arrow">&gt;</span>
          <img class="channel-icon" src="kofi.png" alt="">
          <span class="channel-label"><span class="kofi-label-text">Ko-fi<span class="kofi-splash">support me!</span></span></span>
          <span class="channel-value">jontyali</span>
          <span class="channel-ext">&#8599;</span>
        </a>
      </div>

      <div class="quick-contact">
        <p class="comms-note" style="margin-bottom:0">Or send a message here directly</p>
        <form id="quick-contact-form" class="contact-form">
          <input type="hidden" name="access_key" value="c144a0dd-9856-4eef-b95e-96f8c953ad45">
          <input type="hidden" name="subject" value="New message from jontyali.com">
          <input type="hidden" name="from_name" value="jontyali.com quick contact">
          <input type="checkbox" name="botcheck" class="contact-botcheck" tabindex="-1" autocomplete="off">
          <div class="contact-row">
            <label class="contact-label" for="cf-name">name</label>
            <input class="contact-input" id="cf-name" name="name" type="text" required autocomplete="name">
          </div>
          <div class="contact-row">
            <label class="contact-label" for="cf-email">email (i'll reply here)</label>
            <input class="contact-input" id="cf-email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="contact-row">
            <label class="contact-label" for="cf-message">message</label>
            <textarea class="contact-input contact-textarea" id="cf-message" name="message" rows="4" required></textarea>
          </div>
          <div class="contact-actions">
            <button type="submit" class="contact-submit">send</button>
            <span class="contact-status" id="cf-status" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="../bg-stars.js"></script>
  <script src="../components.js"></script>
  <script>
    document.querySelectorAll('.channel-copy').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.copy)
        btn.textContent = 'copied'
        setTimeout(() => { btn.textContent = 'copy' }, 1500)
      })
    })

    // mobile: match channel bars to email bar width
    const mobileModeQuery = window.matchMedia('(max-width: 768px)')
    const emailChannel = document.querySelector('.channel.email')
    const otherChannels = [...document.querySelectorAll('.channel:not(.email)')]

    function syncChannelWidths() {
      otherChannels.forEach(c => { c.style.width = '' })
      if (!mobileModeQuery.matches) return
      const emailWidth = emailChannel.getBoundingClientRect().width
      otherChannels.forEach(c => { c.style.width = emailWidth + 'px' })
    }

    window.addEventListener('resize', syncChannelWidths)
    window.addEventListener('load', syncChannelWidths)
    mobileModeQuery.addEventListener('change', syncChannelWidths)
    syncChannelWidths()

    const contactForm = document.getElementById('quick-contact-form')
    const contactStatus = document.getElementById('cf-status')
    const contactSubmit = contactForm.querySelector('.contact-submit')

    contactForm.addEventListener('submit', (e) => {
      e.preventDefault()

      contactSubmit.disabled = true
      contactStatus.textContent = 'sending...'
      contactStatus.className = 'contact-status'

      const payload = Object.fromEntries(new FormData(contactForm))

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(res => res.json().then(json => ({ ok: res.ok, json })))
        .then(({ ok, json }) => {
          if (ok && json.success) {
            contactStatus.textContent = "sent — I'll reply to your email soon"
            contactStatus.className = 'contact-status ok'
            contactForm.reset()
          } else {
            contactStatus.textContent = json.message || 'something went wrong — try emailing directly'
            contactStatus.className = 'contact-status err'
          }
        })
        .catch(() => {
          contactStatus.textContent = 'something went wrong — try emailing directly'
          contactStatus.className = 'contact-status err'
        })
        .finally(() => {
          contactSubmit.disabled = false
        })
    })
  </script>

</body>
</html>
