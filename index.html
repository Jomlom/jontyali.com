<link rel="stylesheet" href="style.css">
<style>
body{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
}

.avatar{
  width:clamp(9rem,19vh,17rem);height:clamp(9rem,19vh,17rem);margin-bottom:clamp(1rem,2.2vh,2rem);perspective:800px;outline:none;
}
.avatar-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;transition:transform 0.6s ease;
}
.avatar:hover .avatar-inner,.avatar:focus-visible .avatar-inner{transform:rotateY(180deg)}
.avatar img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;border-radius:50% !important;
  border:1px solid var(--purple-border);backface-visibility:hidden;
}
.avatar .avatar-front{image-rendering:pixelated}
.avatar .avatar-back{transform:rotateY(180deg)}

.hero-panel .hero-name{
  font-family:var(--font-ui);font-size:3rem;line-height:0.9;color:#ffffff;
  letter-spacing:0.02em;margin-bottom:1.2rem;opacity:1;animation:none;
  text-shadow:var(--glow-white);
  white-space:nowrap;
}
.hero-name.typing::after{content:'|';margin-left:0.02em}
.hero-handle{
  font-size:1.3rem;color:var(--text-dim);margin-bottom:1.4rem;letter-spacing:0.03em;
}
.hero-tag{
  font-family:var(--font-mono);font-size:1.5rem;color:var(--text-muted);
  margin-bottom:2rem;letter-spacing:0.03em;
}

.hero-menu{
  position:static;display:flex;flex-direction:column;align-items:stretch;width:26rem;max-width:100%;padding:0;
  border:1px solid var(--purple-border);background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);
}
.hero-menu a{
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(0.4rem,1.1vh,0.7rem) 1.2rem;border-top:1px solid var(--border);
  font-size:1.5rem;line-height:1.2;color:var(--text);text-decoration:none;
}
.hero-menu a:first-child{border-top:0}
.hero-menu a::after{content:'→';color:var(--text-dim)}
.hero-menu a[target="_blank"]::after{content:'↗'}
.hero-menu a:hover,.hero-menu a:focus-visible{background:var(--purple-glow);color:var(--purple);outline:none}
.hero-menu a:hover::after,.hero-menu a:focus-visible::after{color:var(--purple)}

.hero-links{
  display:flex;align-items:center;gap:1.6rem;margin-top:clamp(1.8rem,4.5vh,3.5rem);
}
.hero-links span{font-size:1.2rem;color:var(--text-dim);letter-spacing:0.05em}
.hero-links img{display:block;width:2.4rem;height:2.4rem;opacity:0.85;transition:opacity 0.2s,transform 0.2s}
.hero-links a:hover img,.hero-links a:focus-visible img{opacity:1;transform:translateY(-2px)}

@media (max-width:900px){
  .hero-panel .hero-name{font-size:clamp(2.2rem,11vw,4rem);white-space:nowrap;margin-bottom:0.3rem}
  .hero-tag{font-size:1.2rem;margin-bottom:1.4rem}
  .avatar{width:11rem;height:11rem;margin-bottom:1.2rem}
  .hero-menu{width:100%}
  .hero-links{margin-top:1.5rem}
}
</style>

<!-- type out name on load -->
<script>
const heading = document.querySelector('.hero-name')
const text = heading.textContent
let i = 0
heading.classList.add('typing')
heading.textContent = ''
setTimeout(function step(){
  heading.textContent = text.slice(0, ++i)
  if(i < text.length) setTimeout(step, 20)
  else heading.classList.remove('typing')
}, 300)
</script>
